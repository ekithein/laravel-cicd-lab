name: Laravel CI/CD

on:
  push:
    branches:
      - main
      - develop
      - uat

  pull_request:
    branches:
      - main
      - develop
      - uat

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4

      - name: Copy CI environment
        run: cp .env.ci .env

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Generate application key
        run: php artisan key:generate

      - name: Run tests with coverage
        run: php artisan test --coverage

  phpstan:
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse

  pint:
    runs-on: ubuntu-latest
    needs: phpstan

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run Pint
        run: vendor/bin/pint --test

  deploy-dev:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    needs: pint

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Deploy to development
        run: |
          cp .env.dev .env
          echo "Deploying to DEVELOPMENT with .env.dev"

  deploy-uat:
    if: github.ref == 'refs/heads/uat'
    runs-on: ubuntu-latest
    needs: pint

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Deploy to UAT
        run: |
          cp .env.uat .env
          echo "Deploying to UAT with .env.uat"

  deploy-prod:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: pint

    environment:
      name: production

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Deploy to production
        run: |
          cp .env.prod .env
          echo "Deploying to PRODUCTION with .env.prod"